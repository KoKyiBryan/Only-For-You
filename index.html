<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<meta name="theme-color" content="#fff5f8">

<title>One Little Question ♡</title>

<style>

/* =========================================================
   RESET
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    min-height: 100%;
}

body {

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans Myanmar",
        "Myanmar Text",
        sans-serif;

    color: #30242a;

    background:
        radial-gradient(
            circle at 15% 10%,
            rgba(255, 186, 211, .55),
            transparent 30%
        ),

        radial-gradient(
            circle at 90% 85%,
            rgba(255, 215, 229, .75),
            transparent 32%
        ),

        linear-gradient(
            135deg,
            #fff8fa 0%,
            #ffeef4 50%,
            #fff9fb 100%
        );

    min-height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;

    position: relative;
}


/* =========================================================
   BACKGROUND
========================================================= */

.background-glow {

    position: fixed;

    width: 320px;
    height: 320px;

    border-radius: 50%;

    filter: blur(80px);

    opacity: .45;

    pointer-events: none;

    animation: glowMove 8s ease-in-out infinite alternate;
}

.glow-one {

    background: #ffb6ce;

    top: -120px;
    left: -100px;
}

.glow-two {

    background: #ffcfe0;

    bottom: -130px;
    right: -100px;

    animation-delay: -3s;
}

@keyframes glowMove {

    from {
        transform: translate3d(0,0,0) scale(1);
    }

    to {
        transform: translate3d(30px,20px,0) scale(1.12);
    }
}


/* =========================================================
   CARD
========================================================= */

.wrapper {

    width: min(92%, 430px);

    position: relative;

    z-index: 5;
}

.card {

    width: 100%;

    padding: 34px 25px 30px;

    border-radius: 30px;

    background:
        rgba(255,255,255,.72);

    border:
        1px solid rgba(255,255,255,.95);

    box-shadow:
        0 30px 80px rgba(143,61,91,.14),
        inset 0 1px 0 rgba(255,255,255,.9);

    backdrop-filter: blur(22px);
    -webkit-backdrop-filter: blur(22px);

    position: relative;

    overflow: hidden;

    animation: cardEnter .8s cubic-bezier(.2,.8,.2,1);
}

@keyframes cardEnter {

    from {
        opacity: 0;
        transform:
            translateY(35px)
            scale(.96);
    }

    to {
        opacity: 1;
        transform:
            translateY(0)
            scale(1);
    }
}


/* =========================================================
   TOP LABEL
========================================================= */

.label {

    display: inline-flex;

    align-items: center;
    justify-content: center;

    gap: 6px;

    padding: 7px 13px;

    border-radius: 999px;

    background: #fff0f5;

    color: #c25a7e;

    font-size: 12px;

    font-weight: 600;

    letter-spacing: .2px;

    margin-bottom: 18px;
}


/* =========================================================
   ICON
========================================================= */

.icon-container {

    width: 76px;
    height: 76px;

    margin: 0 auto 18px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 24px;

    background:
        linear-gradient(
            145deg,
            #fff,
            #ffe9f1
        );

    box-shadow:
        0 12px 30px rgba(212,87,126,.15);

    animation: softFloat 3.5s ease-in-out infinite;
}

.icon {

    font-size: 36px;

    filter:
        drop-shadow(
            0 5px 8px rgba(215,75,120,.15)
        );
}

@keyframes softFloat {

    0%,100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-5px);
    }
}


/* =========================================================
   TYPOGRAPHY
========================================================= */

.title {

    font-size: 27px;

    line-height: 1.35;

    font-weight: 750;

    letter-spacing: -.5px;

    color: #35272d;

    margin-bottom: 10px;
}

.subtitle {

    color: #8b737c;

    font-size: 14px;

    line-height: 1.7;

    margin-bottom: 24px;
}


/* =========================================================
   QUESTION
========================================================= */

.question-box {

    padding: 21px 18px;

    border-radius: 21px;

    background:
        linear-gradient(
            135deg,
            rgba(255,245,248,.95),
            rgba(255,255,255,.85)
        );

    border:
        1px solid rgba(232,177,194,.22);

    margin-bottom: 17px;
}

.question {

    font-size: 20px;

    line-height: 1.6;

    font-weight: 700;

    color: #45343b;
}

.attempt {

    margin-top: 8px;

    color: #b3939e;

    font-size: 11px;

    letter-spacing: .3px;
}


/* =========================================================
   ANSWERS
========================================================= */

.answers {

    display: flex;

    flex-direction: column;

    gap: 9px;
}

.answer {

    width: 100%;

    min-height: 53px;

    border: 1px solid rgba(220,170,190,.22);

    border-radius: 16px;

    background:
        rgba(255,255,255,.72);

    color: #5b454e;

    font-family: inherit;

    font-size: 15px;

    font-weight: 600;

    cursor: pointer;

    transition:
        transform .18s ease,
        box-shadow .18s ease,
        background .18s ease,
        border-color .18s ease;

    box-shadow:
        0 4px 12px rgba(100,50,70,.035);
}

.answer:active {

    transform: scale(.975);
}

.answer:hover {

    transform: translateY(-2px);

    background: #fff5f8;

    border-color:
        rgba(218,111,148,.35);

    box-shadow:
        0 9px 22px rgba(180,75,110,.09);
}


/* LOVE BUTTON */

.answer-love {

    margin-top: 3px;

    border: none;

    color: white;

    background:
        linear-gradient(
            135deg,
            #e96892,
            #c83e70
        );

    box-shadow:
        0 10px 24px rgba(200,62,112,.22);
}

.answer-love:hover {

    background:
        linear-gradient(
            135deg,
            #ed7299,
            #c83e70
        );

    box-shadow:
        0 13px 28px rgba(200,62,112,.28);
}


/* =========================================================
   RETRY MESSAGE
========================================================= */

.retry-message {

    min-height: 26px;

    margin-top: 15px;

    color: #c45b7e;

    font-size: 13px;

    line-height: 1.6;

    opacity: 0;

    transform: translateY(5px);

    transition:
        opacity .3s ease,
        transform .3s ease;
}

.retry-message.show {

    opacity: 1;

    transform: translateY(0);
}


/* =========================================================
   FINAL SCREEN
========================================================= */

.final-screen {

    display: none;

    text-align: center;

    animation:
        finalEnter .8s cubic-bezier(.2,.8,.2,1);
}

@keyframes finalEnter {

    from {
        opacity: 0;
        transform: scale(.92) translateY(15px);
    }

    to {
        opacity: 1;
        transform: scale(1) translateY(0);
    }
}

.final-icon {

    font-size: 62px;

    margin-bottom: 15px;

    animation:
        heartBeat 1.25s ease-in-out infinite;
}

@keyframes heartBeat {

    0%,100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.12);
    }
}

.final-title {

    font-size: 28px;

    color: #c94172;

    margin-bottom: 15px;
}

.final-message {

    font-size: 18px;

    line-height: 1.8;

    color: #554149;

    font-weight: 650;

    margin-bottom: 14px;
}

.final-small {

    color: #9a8089;

    font-size: 13px;

    line-height: 1.7;
}


/* =========================================================
   FOOTER
========================================================= */

.footer {

    margin-top: 23px;

    color: #b69da6;

    font-size: 10px;

    letter-spacing: .3px;
}


/* =========================================================
   FLOATING HEARTS
========================================================= */

.floating-heart {

    position: fixed;

    bottom: -30px;

    z-index: 2;

    pointer-events: none;

    font-size: 17px;

    opacity: 0;

    animation:
        floatHeart 5s linear forwards;
}

@keyframes floatHeart {

    0% {

        transform:
            translateY(0)
            rotate(0deg)
            scale(.8);

        opacity: 0;
    }

    15% {

        opacity: .75;
    }

    100% {

        transform:
            translateY(-110vh)
            rotate(25deg)
            scale(1.2);

        opacity: 0;
    }
}


/* =========================================================
   SHAKE
========================================================= */

.shake {

    animation:
        shake .4s ease;
}

@keyframes shake {

    0%,100% {
        transform: translateX(0);
    }

    25% {
        transform: translateX(-5px);
    }

    75% {
        transform: translateX(5px);
    }
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media (max-height: 700px) {

    .card {
        padding-top: 24px;
        padding-bottom: 22px;
    }

    .icon-container {
        width: 62px;
        height: 62px;
        margin-bottom: 12px;
    }

    .icon {
        font-size: 29px;
    }

    .title {
        font-size: 23px;
    }

    .question {
        font-size: 18px;
    }

    .answer {
        min-height: 47px;
    }
}

</style>
</head>


<body>


<!-- BACKGROUND -->

<div class="background-glow glow-one"></div>
<div class="background-glow glow-two"></div>


<div class="wrapper">

<div class="card" id="card">


<!-- =====================================================
     QUIZ
===================================================== -->

<section id="quizScreen">


    <div class="label">
        ♡ A little question
    </div>


    <div class="icon-container">
        <div class="icon">
            💌
        </div>
    </div>


    <h1 class="title">
        မေးစရာလေးရှိတယ်...
    </h1>


    <p class="subtitle">
        အများကြီးမစဉ်းစားနဲ့နော်။<br>
        အမှန်အတိုင်းပဲ ဖြေပေး 👀
    </p>


    <div class="question-box">

        <div class="question">
            ဒီညစောစောအိပ်မှာလား
        </div>

        <div class="attempt" id="attemptText">
            ONE LITTLE QUESTION · 0 / 5
        </div>

    </div>


    <div class="answers">


        <button
            class="answer"
            onclick="wrongAnswer('အိပ်မယ်')">

            အိပ်မယ်

        </button>


        <button
            class="answer"
            onclick="wrongAnswer('မအိပ်ဘူး')">

            မအိပ်ဘူး

        </button>


        <button
            class="answer"
            onclick="wrongAnswer('မသိဘူး')">

            မသိဘူး

        </button>


        <button
            class="answer"
            onclick="wrongAnswer('မပြောပြဘူး')">

            မပြောပြဘူး

        </button>


        <button
            class="answer answer-love"
            onclick="loveAnswer()">

            ချစ်တယ် ❤️

        </button>


    </div>


    <div
        class="retry-message"
        id="retryMessage">
    </div>


    <div class="footer">
        made with a little bit of courage ♡
    </div>


</section>



<!-- =====================================================
     FINAL
===================================================== -->

<section
    class="final-screen"
    id="finalScreen">


    <div class="final-icon">
        ❤️
    </div>


    <h2 class="final-title">
        အဲ့ဒါဆို...
    </h2>


    <p class="final-message">
        ချစ်တယ်လို့တော့<br>
        ပြောပြီနော် 🥹❤️
    </p>


    <p class="final-small">
        ဒီည စောစောအိပ်ဖို့တော့<br>
        မမေးတော့ဘူး 😌
    </p>


    <div class="footer">
        good night, MaMa yay 🫶 ♡
    </div>


</section>


</div>

</div>



<script>

/* =========================================================
   VARIABLES
========================================================= */

let attempts = 0;


/* =========================================================
   RETRY MESSAGES
========================================================= */

const retryMessages = [

    "အဲ့ဒါလည်းမဟုတ်သေးဘူးနော်... ထပ်ရွေးကြည့် 👀",

    "Hmm... အဖြေ မှားနေတယ်ထင်တယ် 😂",

    "သေချာစဉ်းစားပြီး ထပ်ရွေးပေးဦး ❤️",

    "နောက်ဆုံးတစ်ခါနော်... 👀",

    "၅ ကြိမ်တောင်ပြည့်ပြီ... ဘာကိုရွေးရမလဲ သိပြီမလား 😏❤️"

];


/* =========================================================
   WRONG ANSWER
========================================================= */

function wrongAnswer(answer) {

    attempts++;


    const card =
        document.getElementById("card");

    const message =
        document.getElementById("retryMessage");

    const attemptText =
        document.getElementById("attemptText");


    /* Shake card */

    card.classList.remove("shake");

    void card.offsetWidth;

    card.classList.add("shake");


    /* Message */

    const index =
        Math.min(
            attempts - 1,
            retryMessages.length - 1
        );


    message.innerText =
        retryMessages[index];


    message.classList.remove("show");

    void message.offsetWidth;

    message.classList.add("show");


    /* Attempt counter */

    if (attempts < 5) {

        attemptText.innerText =
            `ONE LITTLE QUESTION · ${attempts} / 5`;

    } else {

        attemptText.innerText =
            `ONE LITTLE QUESTION · ${attempts} TIMES`;

    }


    /* Create hearts */

    createHeartBurst(3);

}


/* =========================================================
   LOVE ANSWER
========================================================= */

function loveAnswer() {

    const quiz =
        document.getElementById("quizScreen");

    const final =
        document.getElementById("finalScreen");


    /* Fade out */

    quiz.style.opacity = "0";

    quiz.style.transform = "translateY(-10px)";

    quiz.style.transition =
        "all .45s ease";


    setTimeout(() => {

        quiz.style.display = "none";

        final.style.display = "block";

        createHeartBurst(25);

    }, 450);

}


/* =========================================================
   FLOATING HEART
========================================================= */

function createHeart() {

    const heart =
        document.createElement("div");

    heart.className =
        "floating-heart";


    const symbols = [
        "♡",
        "♥",
        "❤",
        "💗",
        "💕",
        "✨"
    ];


    heart.innerText =
        symbols[
            Math.floor(
                Math.random() * symbols.length
            )
        ];


    heart.style.left =
        Math.random() * 100 + "vw";


    heart.style.fontSize =
        (13 + Math.random() * 15) + "px";


    heart.style.animationDuration =
        (4 + Math.random() * 3) + "s";


    document.body.appendChild(heart);


    setTimeout(() => {

        heart.remove();

    }, 7500);

}


/* =========================================================
   HEART BURST
========================================================= */

function createHeartBurst(amount) {

    for (
        let i = 0;
        i < amount;
        i++
    ) {

        setTimeout(
            createHeart,
            i * 90
        );

    }

}


/* =========================================================
   BACKGROUND HEARTS
========================================================= */

setInterval(() => {

    if (
        Math.random() > .35
    ) {

        createHeart();

    }

}, 1800);

</script>


</body>
</html>
